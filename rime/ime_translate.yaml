# ime_translate configuration (flat key: value, # comments)
#
# WARNING: never put an API key in this file. It lives in the Rime user
#   directory, which is rescanned wholesale on "Redeploy" and is frequently
#   pushed to GitHub as config sync.
#   Store the key in the Keychain instead:
#     security add-generic-password -s ime-translate -a <account> -w
#   (-w last: security prompts for the key, so it stays out of shell history)
#   and put only the account name here.
#
# Changes take effect after a redeploy, with no draft open: the input menu's
# Deploy, or
#   "/Library/Input Methods/Squirrel.app/Contents/MacOS/Squirrel" --reload
#
# Two backends, switched by a lone tap of Right Option inside the translation
# schema: the
# local slot (the keys with no prefix; translate by default) and the cloud slot
# (the same keys with a cloud_ prefix). The choice is remembered, in
# ime_translate.active next to this file. See README.md, "Using a large
# language model".
#
# --- local slot (default: translate, Apple's on-device NMT) ---
# backend: libretranslate         # openai | libretranslate | anthropic
# base_url: http://127.0.0.1:8989
#
# timeout_ms: 1500                # WARNING: this number is the upper bound on
#                                 # how long the IME freezes after you press
#                                 # Enter. Past about 2500 some apps lose the
#                                 # draft (spike S13), so a larger value is
#                                 # capped at 2500.
# max_chars: 2000                 # characters, not bytes
# debug_log: false                # log goes to ~/Library/Logs/ime_translate.log
#                                 # max_chars, debug_log and allow_remote are
#                                 # shared by both slots
#
# A value containing " #" must be quoted, or the rest is read as a comment:
# prompt: "Translate ... #tags stay as they are"
#
# --- cloud slot (off until cloud_backend and cloud_base_url are set) ---
# Every Chinese sentence you translate on the cloud slot goes to a third party.
# That is a known cost, not a defect. A translation from a non-loopback server
# shows a ☁.
# allow_remote: true                                    # without this, non-loopback is refused
# cloud_backend: openai                                 # GLM speaks the OpenAI chat API
# cloud_base_url: https://open.bigmodel.cn/api/paas/v4  # required; remote must be https
# cloud_model: glm-4-flash-250414
# cloud_api_key_account: zhipu                          # Keychain account name, not the key
# cloud_timeout_ms: 2500                                # unset cloud_ keys take the defaults,
#                                                       # not the local slot's values
# For Anthropic: cloud_backend: anthropic, cloud_base_url:
# https://api.anthropic.com/v1, cloud_model: claude-haiku-4-5,
# cloud_max_tokens: 1024
